    <ellipse cx="820" cy="330" rx="215" ry="86" fill="none" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="1.5"/>
    <ellipse cx="820" cy="330" rx="215" ry="160" fill="none" stroke="#60a5fa" stroke-opacity="0.22" stroke-width="1.2"/>
    <ellipse cx="820" cy="330" rx="86" ry="215" fill="none" stroke="#60a5fa" stroke-opacity="0.35" stroke-width="1.5"/>
    <ellipse cx="820" cy="330" rx="160" ry="215" fill="none" stroke="#60a5fa" stroke-opacity="0.22" stroke-width="1.2"/>
    <line x1="605" y1="330" x2="1035" y2="330" stroke="#60a5fa" stroke-opacity="0.3" stroke-width="1.2"/>
    <!-- Route arc + hubs -->
    <path d="M 665 420 Q 820 150 985 380" fill="none" stroke="url(#arc)" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10"/>
    <circle cx="665" cy="420" r="8" fill="#22d3ee"/>
    <circle cx="985" cy="380" r="8" fill="#22d3ee"/>
    <circle cx="820" cy="245" r="7" fill="#f59e0b"/>
    <circle cx="665" cy="420" r="15" fill="#22d3ee" fill-opacity="0.25"/>
